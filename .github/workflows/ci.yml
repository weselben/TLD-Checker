name: ci

on:
  push:
    branches: [main, feat/cloudflare-worker-vue]
  pull_request:
    branches: [main, feat/cloudflare-worker-vue]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check / build
        run: npm run build

      - name: Run tests (vitest)
        run: npm test
